[package]
name = "smplx-sdk"
version = "0.0.6"
description = "Simplex sdk to simplify the development with simplicity"
license.workspace = true
edition.workspace = true
repository = "https://github.com/BlockstreamResearch/smplx"
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
sha2 = { workspace = true }
simplicityhl = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }

serde_json = { version = "1.0" }
elements-miniscript = { version = "0.4", features = ["base64", "serde"] }
bip39 = { version = "2.0.0", features = ["rand"] }
dyn-clone = { version = "1.0.20" }
bitcoin_hashes = { version = "0.14.1" }

# Native-only deps: electrsd/bitcoind and minreq+rustls cannot build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
electrsd = { workspace = true }
minreq = { workspace = true }
